name: ACMA - validar contenedor web IONOS y Railway

on:
  push:
    branches:
      - 'migracion-supabase-*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/ci-contenedor-railway.yml'
      - 'deploy/ionos/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contenedor_acma:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v4
      - name: Habilitar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compilar React y FastAPI en Docker, sin secretos
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: acma-railway:test
      - name: Verificar que la imagen contenga React y FastAPI
        run: |
          docker run --rm --entrypoint sh acma-railway:test -ec '
            test -f /app/frontend/dist/index.html
            test -f /app/backend/main.py
            test -f /app/backend/core/frontend_integrado.py
            command -v uvicorn
            ! test -f /app/.env
            ! test -f /app/backend/.env
            echo "Imagen ACMA lista: React + FastAPI, sin .env"
          '

      - name: Validar Docker Compose IONOS (simple y completo) sin claves
        run: |
          printf 'ACMA_DOMINIO=acma.example.invalid\nDATABASE_URL=postgresql+asyncpg://dummy:dummy@example.invalid:5432/postgres\nSUPABASE_URL=https://example.invalid\nSUPABASE_SECRET_KEY=placeholder\nJWT_SECRETO=placeholder_32_character_secret_1234\nCLAVE_CIFRADO=placeholder\n' > .env
          docker compose --env-file .env -f deploy/ionos/compose.yml config --quiet
          docker compose --profile completo --env-file .env -f deploy/ionos/compose.yml config --quiet
          rm -f .env
      - name: Validar configuración Caddy para dominio IONOS
        run: |
          docker run --rm \
            -e ACMA_DOMINIO=acma.example.invalid \
            -v "$PWD/deploy/ionos/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
