name: ACMA - verificaciones sin Docker

on:
  push:
    branches:
      - 'migracion-supabase-*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias mínimas para pruebas sin DB
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.28' 'starlette>=0.41'
      - name: Sintaxis de nuevas integraciones
        run: python -m compileall -q backend/core/frontend_integrado.py backend/services/almacenamiento_supabase.py scripts/test_migracion_sin_db.py
      - name: Smoke test sin Docker ni conexiones reales
        run: python scripts/test_migracion_sin_db.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias React
        working-directory: frontend
        run: npm ci
      - name: Compilar React original
        working-directory: frontend
        run: npm run build
      - name: Pruebas unitarias React
        working-directory: frontend
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar plataformas faltantes
        working-directory: mobile_flutter
        run: flutter create --platforms=android,ios --project-name acma_mobile .
      - name: Instalar dependencias
        working-directory: mobile_flutter
        run: flutter pub get
      - name: Icono ACMA original para Android e iOS
        working-directory: mobile_flutter
        run: dart run flutter_launcher_icons
      - name: Analisis Flutter
        working-directory: mobile_flutter
        run: flutter analyze
      - name: Tests Flutter
        working-directory: mobile_flutter
        run: flutter test
