name: ACMA - verificaciones sin Docker

on:
  push:
    branches:
      - main
      - 'migracion-supabase-*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  paridad_original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No eliminar funcionalidades (solo notas y lanzadores redundantes)
        run: |
          borrados="$(git diff --name-only --diff-filter=D origin/main...HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            case "$archivo" in
              BITACORA.md|CONTEXTO.md|docs/estado_bd_supabase_20261115.md|\
              CREAR_SUPERADMIN_ZAID.bat|GENERAR_APK_ACMA_IONOS.bat|\
              crear_app_android_acma.bat|iniciar_acma.bat|\
              detener_acma.bat|iniciar_acma_sin_docker.bat)
                echo "Limpieza de documento o lanzador redundante: $archivo"
                ;;
              *)
                echo "ERROR: eliminación no autorizada: $archivo"
                exit 1
                ;;
            esac
          done <<< "$borrados"
      - name: Mantener pantallas, migraciones y módulos no relacionados intactos
        run: |
          cambios="$(git diff --name-only origin/main...HEAD -- frontend/src frontend/public backend/alembic/versions)"
          prohibidos=0
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            case "$archivo" in
              frontend/src/components/AppShell.tsx|\
              frontend/src/components/IconosAcma.tsx|\
              frontend/public/icono.svg|\
              frontend/public/icono-192.png|\
              frontend/public/icono-512.png|\
              frontend/src/components/CampanaNotificaciones.tsx|\
              frontend/src/components/ui.tsx|\
              frontend/src/components/Buscador.tsx|\
              frontend/src/index.css|\
              frontend/src/pages/RoleHub.tsx|\
              frontend/src/pages/catalogos/Catalogos.tsx|\
              frontend/src/pages/folios/Folios.tsx|\
              frontend/src/pages/admin/Unidades.tsx|\
              frontend/src/pages/auth/Marco.tsx|\
              frontend/src/App.tsx|\
              frontend/src/contexts/AuthContext.tsx|\
              frontend/src/services/api.ts)
                # Se admiten cambios focalizados en el acceso y restauración de
                # sesiones; los demás módulos de negocio permanecen intactos.
                echo "Cambio visual y responsivo permitido: $archivo"
                ;;
              *)
                echo "ERROR: módulo o migración fuera del alcance móvil: $archivo"
                prohibidos=1
                ;;
            esac
          done <<< "$cambios"
          exit "$prohibidos"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias mínimas para pruebas sin DB
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.28' 'starlette>=0.41'
      - name: Sintaxis de nuevas integraciones
        run: python -m compileall -q backend/core/frontend_integrado.py backend/core/esquema_postgresql.py backend/services/almacenamiento_supabase.py backend/scripts/bootstrap_superadmin.py backend/scripts/preflight_supabase.py backend/scripts/seed_produccion.py backend/scripts/crear_superadmin_zaid.py scripts/configurar_acma_supabase.py scripts/crear_admin_acma.py scripts/diagnosticar_env_supabase.py scripts/test_diagnosticar_env_supabase.py scripts/test_configurar_acma_supabase.py scripts/test_migracion_sin_db.py
      - name: Smoke test sin Docker ni conexiones reales
        run: python scripts/test_migracion_sin_db.py
      - name: Pruebas de asistente Supabase sin conexión
        run: python scripts/test_configurar_acma_supabase.py
      - name: Pruebas de recuperación de .env sin secretos
        run: python scripts/test_diagnosticar_env_supabase.py
      - name: Verificar alta de superadmin sin contraseñas en Git
        run: python scripts/test_crear_superadmin_zaid_offline.py
      - name: Probar lanzador Windows Android y permisos solo debug
        run: python scripts/test_iniciar_flutter_acma.py
      - name: Probar manifest de produccion y dominios HTTPS para IONOS
        run: python scripts/test_preparar_flutter_release_acma.py
      - name: Validar arranque Railway y dominio automatico
        run: python scripts/test_railway_start.py
      - name: Validar Resend HTTPS y restablecimiento sin Redis
        run: python scripts/test_resend_api.py
      - name: Validar Mailjet HTTPS sin enviar correos reales
        run: |
          python -m compileall -q backend/services/mailjet_api.py backend/services/correo.py backend/core/config.py backend/services/auth_service.py scripts/test_mailjet_api.py
          python scripts/test_mailjet_api.py
      - name: Validar correo de recuperación y enlace en navegador
        run: |
          python -m compileall -q backend/services/notificaciones_service.py scripts/test_reset_email_link.py
          python scripts/test_reset_email_link.py
      - name: Validar restablecimiento Safari sin JS y ajustes responsivos
        run: |
          python -m compileall -q backend/routers/recuperacion_web.py scripts/test_recuperacion_ios_layout.py
          python scripts/test_recuperacion_ios_layout.py
      - name: Validar iconos de ACMA para PWA y Android
        run: python scripts/test_marca_acma.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias React
        working-directory: frontend
        run: npm ci
      - name: Compilar React original
        working-directory: frontend
        run: npm run build
      - name: Pruebas unitarias React
        working-directory: frontend
        run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar plataformas faltantes
        working-directory: mobile_flutter
        run: flutter create --platforms=android,ios --project-name acma_mobile .
      - name: Instalar dependencias
        working-directory: mobile_flutter
        run: flutter pub get
      - name: Icono ACMA original para Android e iOS
        working-directory: mobile_flutter
        run: dart run flutter_launcher_icons
      - name: Analisis Flutter
        working-directory: mobile_flutter
        run: flutter analyze
      - name: Tests Flutter
        working-directory: mobile_flutter
        run: flutter test
