# ACMA — infraestructura de desarrollo (PostgreSQL + PostGIS, Redis, MinIO).
# Puertos de host distintos a los de acma-proyecto para que ambos convivan.
# P11a (cierra la decision pendiente n.o 12): las imagenes van fijadas por version exacta o digest para que un `docker compose pull`
# no cambie la version por debajo. Para subir una: actualizar el valor aqui, probar y commitear el cambio.
name: acma

services:
  postgres:
    # PostgreSQL 16.4 + PostGIS 3.4 (la etiqueta 16-3.4 flota sobre los parches, el digest no).
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: acma_nuevo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-acma_super}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD:-cambiar_super}
      POSTGRES_DB: acma
      # Contraseñas de los roles de aplicación, leídas por el script de init.
      ACMA_OWNER_PASSWORD: ${ACMA_OWNER_PASSWORD:-cambiar_owner}
      ACMA_API_PASSWORD: ${ACMA_API_PASSWORD:-cambiar_api}
    ports:
      - "${POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - acma_nuevo_pg:/var/lib/postgresql/data
      - ./docker/postgres/01_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-acma_super} -d acma"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.9-alpine
    container_name: acma_nuevo_redis
    restart: unless-stopped
    command: redis-server --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # RELEASE.2025-09-07T16-13-09Z. MinIO no publica etiquetas estables fuera de RELEASE.*: va por digest.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: acma_nuevo_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-acma_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cambiar_minio}
    ports:
      - "${MINIO_HOST_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - acma_nuevo_minio:/data

  solver:
    # F2-06: el optimizador de rutas (OR-Tools). En Linux la API carga OR-Tools en proceso y este servicio no
    # hace falta; en Windows el Control de aplicaciones inteligente bloquea su binario nativo, asi que el motor
    # corre aqui. El modelo se **monta** desde services/rutas/ para que la API y el contenedor no se desincronicen.
    build: ./backend/solver
    container_name: acma_nuevo_solver
    restart: unless-stopped
    ports:
      - "${SOLVER_HOST_PORT:-8099}:8099"
    volumes:
      - ./backend/services/rutas/modelo_ortools.py:/app/modelo_ortools.py:ro

volumes:
  acma_nuevo_pg:
  acma_nuevo_minio:
